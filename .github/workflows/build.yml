name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Android Build Configuration
        run: |
          # 1. تحديث الـ Compile SDK إلى 36 لحل مشكلة shared_preferences
          find . -name "build.gradle*" -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          
          # 2. توحيد الـ JVM Target إلى 17 في كل ملفات الـ gradle لمنع تعارض Java و Kotlin
          find . -name "build.gradle*" -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' {} +
          
          # 3. إجبار الجافا على التوافق مع إصدار 17
          find . -name "build.gradle*" -exec sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetCompatibility = JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' {} +

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
